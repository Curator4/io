syntax = "proto3";

package io;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/curator4/io/backend/internal/proto";

// Core message types
message User {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message MediaItem {
  string type = 1;      // "image", "video", "file", "audio"
  string url = 2;
  string file_name = 3;
}

message MessageContent {
  string text = 1;
  repeated MediaItem media = 2;
}

// actions ai can trigger
message Action {
  oneof action_type {
    ReactionAction reaction = 1;
    WebSearchAction web_search = 2;
    ImageGenerationAction image_generation = 3;
    CodeInterpreterAction code_interpreter = 4;
  };
}

message ReactionAction {
  string emoji = 1;
}

message WebSearchAction {
  repeated string queries = 1;
  repeated WebSearchItem results = 2;
}

message WebSearchItem {
  string title = 1;
  string url = 2;
  string snippet = 3;
}

message ImageGenerationAction {
  string image_data = 1; // base64 encoded image
}

message CodeInterpreterAction {
  string code = 1;
  repeated string outputs = 2;
}

// conversation lifecycle info
message ConversationLifecycle {
  bool is_new_conversation = 1;
  string conversation_id = 2;
  string conversation_name = 3;
  google.protobuf.Timestamp started_at = 4;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  string user_id = 3; // null for assistant messages
  string role = 4; // "user", "assistant", "system"
  MessageContent content = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Conversation {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message Provider {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message Model {
  string id = 1;
  string provider_id = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
}

message AIConfig {
  string id = 1;
  string name = 2;
  Model model = 3;
  string system_prompt = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
}

// Request/Response messages
message SendMessageRequest {
  MessageContent content = 1;
  string username = 2;
}

message SendMessageResponse {
  MessageContent content = 1; // The AI's response
  repeated Action actions = 2;
  ConversationLifecycle lifecycle = 3;
}

message StoreMessageRequest {
  MessageContent content = 1;
  string username = 2;
}

message StoreMessageResponse {
  bool success = 1;
  ConversationLifecycle lifecycle = 2;
}

message ListConversationsRequest {
  string user_id = 1;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message LoadConversationRequest {
  string conversation_id = 1;
  string user_id = 2;
}

message LoadConversationResponse {
  Conversation conversation = 1;
  repeated Message messages = 2;
}

message DeleteConversationRequest {
  string conversation_id = 1;
  string user_id = 2;
}

message DeleteConversationResponse {
  bool success = 1;
}

message ListAIConfigsRequest {}

message ListAIConfigsResponse {
  repeated AIConfig configs = 1;
}

message SwitchAIConfigRequest {
  string config_id = 1;
  string user_id = 2;
}

message SwitchAIConfigResponse {
  bool success = 1;
  AIConfig config = 2;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message ClearConversationRequest {
  string user_id = 1;
}

message ClearConversationResponse {
  bool success = 1;
}

// The main service
service IOService {
  // Send a message and get AI response
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // Send message to backend only for storage
  rpc StoreMessage(StoreMessageRequest) returns (StoreMessageResponse);

  // Conversation management
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc LoadConversation(LoadConversationRequest) returns (LoadConversationResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  rpc ClearConversation(ClearConversationRequest) returns (ClearConversationResponse);

  // AI Config management
  rpc ListAIConfigs(ListAIConfigsRequest) returns (ListAIConfigsResponse);
  rpc SwitchAIConfig(SwitchAIConfigRequest) returns (SwitchAIConfigResponse);

  // Provider management
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
}
